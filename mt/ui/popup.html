<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default;
    font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: #ececf0; }
  /* The panels have no system window shadow (it is redrawn a beat late when the content changes, which showed as a
     flicker); the cards draw their own, and this padding leaves room for it. overlay.py allows for the padding. */
  #wrap { display: inline-flex; align-items: flex-start; gap: 4px; padding: 14px; }
  .card { box-sizing: border-box; background: #2a2b31; border: 1px solid rgba(255,255,255,.14); border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .tip { border-radius: 10px; padding: 7px 12px; white-space: pre; }  /* pre: a tooltip may have several lines */
  .tip .tt { font-weight: 600; margin-bottom: 4px; }
  .tip .ts { color: #a9aab4; }
  .tip .li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .tip .li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #ffb340; flex: none; }  /* amber, like the warning button */
  .k { color: #a9aab4; margin-left: 8px; }
  /* the Pause / Cancel bar attached to the Stop button */
  .ctl { display: flex; gap: 2px; padding: 4px 4px 4px 6px; background: #1e1f24; border-radius: 0 16px 16px 0; border-left: 0; box-shadow: 8px 10px 26px rgba(0,0,0,.4); }
  .ctl.right { flex-direction: row-reverse; padding: 4px 6px 4px 4px; border-radius: 16px 0 0 16px; border-left: 1px solid rgba(255,255,255,.14); border-right: 0; box-shadow: -8px 10px 26px rgba(0,0,0,.4); }
  .ctlclip { clip-path: inset(-30px -40px -40px 0); }  /* the bar slides out from behind the toolbar's edge: nothing shows on that side of the card */
  .ctlclip.right { clip-path: inset(-30px 0 -40px -40px); }
  .ctlclip.in .ctl { animation: ctlL .18s cubic-bezier(.2,.8,.2,1); }
  .ctlclip.right.in .ctl { animation-name: ctlR; }
  .ctlclip.out .ctl { animation: none; transition: transform .18s cubic-bezier(.5,0,.8,.4), opacity .18s; transform: translateX(-100%); opacity: 0; }
  .ctlclip.right.out .ctl { transform: translateX(100%); }
  @keyframes ctlL { from { transform: translateX(-100%); } to { transform: none; } }
  @keyframes ctlR { from { transform: translateX(100%); } to { transform: none; } }
  .cb { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #ececf0; cursor: pointer; }
  .cb.amb { color: #ffb340; }
  .cb.red { color: #ff6b61; }
  .cb.hov { background: rgba(255,255,255,.12); }
  .cb.red.hov { background: rgba(255,69,58,.18); }
  /* the device-changed toast: one line, an icon, "Mic: device" */
  .toast { display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 9px; white-space: nowrap; border-radius: 12px; transition: opacity .25s; }
  .toast { animation: toastin .25s; }
  @keyframes toastin { from { opacity: 0; } to { opacity: 1; } }
  .toast.fade { opacity: 0; animation: none; }
  .toast .ic { flex: none; width: 32px; height: 32px; border-radius: 9px; background: rgba(100,168,255,.18); color: #9dc0ff; display: flex; align-items: center; justify-content: center; }
  .toast .l { color: #a9aab4; }
  .toast b { color: #fff; font-weight: 600; }
  .toast .two { position: relative; width: 28px; height: 28px; }
  .toast .two svg { position: absolute; }
  .toast .two svg:nth-child(1) { left: 0; top: 0; }
  .toast .two svg:nth-child(3) { right: 0; bottom: 0; }
  .toast .two i { position: absolute; left: 50%; top: 1px; bottom: 1px; width: 1.5px; margin-left: -.75px; background: #9dc0ff; opacity: .7; transform: rotate(45deg); border-radius: 1px; }
  .menu { width: 210px; padding: 6px 0; }
  .sub { margin-top: 7px; min-width: 170px; padding: 6px 0; visibility: hidden; }
  .sub.on { visibility: visible; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 7px 12px; border-radius: 8px; margin: 0 4px; cursor: pointer; white-space: nowrap; }
  .row.hov, .row.open { background: rgba(255,255,255,.12); }
  .sep { height: 1px; background: rgba(255,255,255,.12); margin: 4px 8px; }
  .status { width: 320px; padding: 6px 8px; display: flex; flex-direction: column; }
  .status .rows { margin-right: -5px; }  /* the scrollbar's 5px gutter sits in the card's padding, so the buttons never move */
  .hd { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 2px 6px; font-size: 12px; color: #a9aab4; flex: none; }
  .hd .x { width: 28px; height: 28px; border-radius: 8px; }
  .tb2 + .tb2 { border-top: 1px solid rgba(255,255,255,.1); }
  .th { display: flex; align-items: center; gap: 8px; padding: 8px 4px 8px 6px; border-radius: 9px; cursor: pointer; }
  .th.hov { background: rgba(255,255,255,.08); }
  .th .chev { flex: none; width: 12px; margin-right: -2px; color: #8d8e98; display: flex; }
  .th .si { flex: none; width: 18px; display: flex; justify-content: center; }
  .th .tt { flex: 1; min-width: 0; }
  .th .tt b { display: block; font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .th .tt small { display: block; font-size: 12px; color: #a9aab4; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .th .tt small.amb { color: #ffb340; }
  .th .tt small.red { color: #ff8a80; }
  .th .tt small.grn { color: #7be495; }
  .ib { display: flex; gap: 2px; flex: none; }
  .ib i { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #c9cad2; font-style: normal; cursor: pointer; }
  .ib i.hov { background: rgba(255,255,255,.14); color: #fff; }
  .ib i.amb { color: #ffb340; }
  .ib i.red { color: #ff8a80; }
  .ib i.red.hov { background: rgba(255,69,58,.2); }
  .tbody { padding: 0 6px 8px 24px; }  /* the steps' icons line up with the tab's status icon, not its arrow */
  .tfoot { flex: none; padding: 4px 6px 4px; }
  .head { display: flex; align-items: center; justify-content: space-between; margin: -4px -6px 4px 0; min-height: 24px; }
  .head span { font-size: 12px; color: #a9aab4; }
  .x { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #a9aab4; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .x.hov { background: rgba(255,255,255,.12); color: #fff; }
  .step { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; font-size: 13px; line-height: 1.3; color: #ececf0; }
  .step.now { color: #fff; }
  .step.todo { color: #a9aab4; }
  .step .ic { flex: none; width: 18px; display: flex; justify-content: center; padding-top: 1px; }
  .step small { display: block; font-size: 12px; color: #a9aab4; }
  .kid { display: flex; gap: 8px; align-items: center; margin: 0 0 2px 10px; padding: 3px 0 3px 12px; border-left: 1px solid rgba(255,255,255,.18); font-size: 12px; }
  .kid.now { color: #fff; }
  .kid.paused { color: #fff; }
  .kid.paused .r { color: #ffb340; }
  .step.paused, .step.cancelled { color: #fff; }
  .step.cancelled { color: #a9aab4; }
  .ptag { font-size: 12px; color: #ffb340; margin: 0 0 2px; }
  .ptag.red { color: #ff8a80; }
  .snote { font-size: 12px; color: #a9aab4; margin-top: 6px; line-height: 1.35; }
  .b.pz { color: #ffb340; }
  .b.cn { color: #ff8a80; }
  .b .bi { display: inline-flex; margin-right: 6px; }
  .kid .r { margin-left: auto; color: #a9aab4; white-space: nowrap; }
  .ring { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #8d8e98; box-sizing: border-box; margin-top: 2px; }
  .spin { width: 13px; height: 13px; border-radius: 50%; border: 2.5px solid #64a8ff; border-right-color: transparent; box-sizing: border-box; animation: spin 1s linear infinite; margin-top: 1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .job + .job { border-top: 1px solid rgba(255,255,255,.12); margin-top: 8px; padding-top: 8px; }
  .jname { font-size: 12px; color: #a9aab4; margin-bottom: 2px; }
  .err { color: #ff8a80; font-size: 12px; line-height: 1.35; padding: 4px 0; }
  .btns { display: flex; gap: 8px; margin-top: 8px; }
  .b { flex: 1 1 0; min-width: 0; height: 30px; border: 0; border-radius: 8px; background: rgba(255,255,255,.14); color: #fff; font: inherit; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
  .b.hov { background: rgba(255,255,255,.22); }
  .b.main { background: #f2f2f5; color: #1e1f24; font-weight: 600; }
  .b.main.hov { background: #fff; }
  .note { font-size: 12px; color: #a9aab4; margin-top: 6px; line-height: 1.35; }
  /* the documents list */
  .docs { width: 380px; padding: 12px 14px; display: flex; flex-direction: column; }
  .dh { display: flex; align-items: center; justify-content: space-between; margin: -2px -5px 6px 0; flex: none; }
  .dh b { font-size: 13px; font-weight: 600; }
  .dh .n { font-size: 12px; color: #a9aab4; margin-left: 8px; font-weight: 400; }
  .rows { flex: 1; min-height: 0; overflow-y: scroll; margin-right: -10px; }  /* the 5px scrollbar gutter is always there: the rows end 5px past the card's padding, like the close button */
  .rows::-webkit-scrollbar { width: 5px; }
  .rows::-webkit-scrollbar-track { background: transparent; }
  .rows::-webkit-scrollbar-thumb { background: rgba(255,255,255,.3); border-radius: 3px; }
  .dr { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0 8px 6px; border-radius: 9px; }
  .b, .x, .tr, .row { cursor: pointer; }
  .dr + .dr { margin-top: 2px; }
  .ft { flex: none; width: 30px; height: 36px; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; box-sizing: border-box; font: 700 9px -apple-system, sans-serif; letter-spacing: .02em; }
  .ft.pdf { background: rgba(255,107,97,.18); color: #ff8a80; } .ft.docx { background: rgba(100,168,255,.2); color: #9dc0ff; } .ft.pptx { background: rgba(255,179,64,.2); color: #ffb340; }
  .ft.xlsx { background: rgba(48,209,88,.18); color: #7be495; } .ft.txt { background: rgba(255,255,255,.12); color: #c9cad2; } .ft.img { background: rgba(191,130,255,.2); color: #d1a8ff; }
  .dm { flex: 1; min-width: 0; }
  .dn { font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dd { font-size: 12px; color: #a9aab4; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pb { height: 3px; border-radius: 2px; background: rgba(255,255,255,.14); margin-top: 6px; overflow: hidden; } .pb i { display: block; height: 100%; background: #64a8ff; border-radius: 2px; }
  .ds { flex: none; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #a9aab4; white-space: nowrap; padding-top: 2px; }
  .ds.ok { color: #7be495; } .ds.warn { color: #ffb340; } .ds.err { color: #ff8a80; }
  .tr { flex: none; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #a9aab4; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-top: -1px; }
  .tr.hov { background: rgba(255,69,58,.2); color: #ff6b61; }
  .dfoot { margin-top: 8px; flex: none; }
  .dfoot .b { width: 100%; flex: none; }
  .empty { padding: 22px 10px 14px; text-align: center; color: #a9aab4; font-size: 12.5px; line-height: 1.45; }
  .empty b { display: block; color: #fff; font-size: 13px; margin-bottom: 4px; }
  button, button:focus, button:focus-visible, .row, .row:focus, .row:focus-visible { outline: none; }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
  const wrap = document.getElementById("wrap");
  let spec = null, subOpen = false, lastSize = "", hov = null;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function post(msg) { window.webkit.messageHandlers.bridge.postMessage(JSON.stringify(msg)); }

  const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const CHECK_S = CHECK.replace('width="16" height="16"', 'width="14" height="14"');
  const CLOSE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  const PAUSE_S = '<svg width="14" height="14" viewBox="0 0 24 24" fill="#ffb340" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
  const PAUSE_B = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
  const PLAY_B = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';
  const X_B = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const X_S = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8d8e98" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function icon(state) {
    return state === "done" ? CHECK : state === "now" ? '<span class="spin"></span>' : state === "paused" ? PAUSE_S : state === "cancelled" ? X_S : '<span class="ring"></span>';
  }

  function renderTip(s) {
    if (s.items) {  // a heading and a bulleted list
      return '<div class="card tip"><div class="tt">' + esc(s.text) + "</div>" + s.items.map((i) => '<div class="li">' + esc(i) + "</div>").join("") + "</div>";
    }
    if (s.sub) return '<div class="card tip" style="max-width:340px;white-space:normal"><div class="tt" style="margin-bottom:2px">' + esc(s.text) + '</div><div class="ts">' + esc(s.sub) + "</div></div>";  // a meeting's full title and when it was recorded
    return '<div class="card tip">' + esc(s.text) + (s.hotkey ? '<span class="k">' + esc(s.hotkey) + "</span>" : "") + "</div>";
  }

  const SVG = (w, body) => '<svg width="' + w + '" height="' + w + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + "</svg>";
  const ICON_MIC = (w) => SVG(w, '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>');
  const ICON_SYS = (w) => SVG(w, '<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/>');

  function renderToast(s) {  // s.lines: [{who: "Mic" | "System" | "Mic and System", device}]; two lines: one toast for both
    const one = s.lines.length === 1 ? s.lines[0].who : "Mic and System";
    const icon = one === "Mic" ? ICON_MIC(18) : one === "System" ? ICON_SYS(18) : '<span class="two">' + ICON_MIC(13) + "<i></i>" + ICON_SYS(13) + "</span>";
    const text = s.lines.map((l) => '<div><span class="l">' + esc(l.who) + ":</span> <b>" + esc(l.device) + "</b></div>").join("");
    return '<div class="card toast"><span class="ic">' + icon + '</span><div style="line-height:1.4">' + text + "</div></div>";
  }

  const CTL_PAUSE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
  const CTL_PLAY = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';
  const CTL_BIN = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>';

  function renderCtl(s) {  // the first button pauses (resumes, when paused), the second cancels the recording
    const side = s.side === "right" ? "right" : "";
    return '<div class="ctlclip ' + side + (s.fresh ? " in" : " ready") + '"><div class="card ctl ' + side + '"><div class="cb ' + (s.paused ? "amb" : "") + '" data-act="pause">' + (s.paused ? CTL_PLAY : CTL_PAUSE) +
      '</div><div class="cb red" data-act="cancel">' + CTL_BIN + "</div></div></div>";
  }

  function renderMenu(s) {
    const items = s.items.map((it, i) => {
      if (it.divider) return '<div class="sep"></div>';
      const label = esc(it.label), hint = it.hint ? '<span class="k" style="margin:0">' + esc(it.hint) + "</span>" : "";
      if (it.sub) {
        return '<div class="row' + (subOpen ? " open" : "") + '" role="menuitem" tabindex="0" data-sub="1"><span>' + label + '</span><span class="k" style="margin:0">' + (s.side === "right" ? "‹" : "›") + "</span></div>";
      }
      return '<div class="row" role="menuitem" tabindex="0" data-id="' + esc(it.id) + '"><span>' + label + "</span>" + hint + "</div>";
    }).join("");
    const menu = '<div class="card menu" role="menu">' + items + "</div>";
    // The submenu is always laid out (just hidden), so the panel never resizes when it opens: resizing a web view
    // flickers. Python lets clicks pass through the empty parts of the panel (see "rects").
    let sub = "";
    const withSub = s.items.find((x) => x.sub);
    if (withSub) {
      sub = '<div class="card sub" role="menu">' + withSub.sub.map((o) =>
        '<div class="row" role="menuitemradio" tabindex="0" data-id="' + esc(o.id) + '"><span>' + esc(o.label) + "</span><span class=\"k\" style=\"margin:0\">" + (o.checked ? "✓" : "") + "</span></div>").join("") + "</div>";
    }
    wrap.style.flexDirection = s.side === "right" ? "row-reverse" : "row";
    return menu + sub;
  }

  function renderSteps(job) {
    return job.steps.map((st) => {
      const kids = (st.children || []).map((c) =>
        '<div class="kid ' + c.state + '">' + (c.state === "done" ? CHECK_S : c.state === "now" ? '<span class="spin" style="width:11px;height:11px;border-width:2px"></span>' : c.state === "paused" ? PAUSE_S : c.state === "cancelled" ? X_S : '<span class="ring" style="width:11px;height:11px"></span>') +
        "<span>" + esc(c.label) + '</span><span class="r">' + esc(c.sub || "") + "</span></div>").join("");
      return '<div class="step ' + st.state + '"><span class="ic">' + icon(st.state) + "</span><div>" + esc(st.label) + (st.sub ? "<small>" + esc(st.sub) + "</small>" : st.detail && st.state !== "done" ? "<small>" + esc(st.detail).replace(/\n/g, "<br>") + "</small>" : "") + "</div></div>" + kids;
    }).join("");
  }

  // ---- the processing panel: one tab per meeting, newest first. Clicking a tab's row opens or closes it (one open at a time,
  // none is allowed); the icon buttons on its right act without opening it. Until you open or close a tab yourself the
  // meeting being processed is open; after that your choice stays.
  let openJob = null, touched = false;
  const IC = (path, fill) => '<svg width="16" height="16" viewBox="0 0 24 24" fill="' + (fill ? "currentColor" : "none") + '" stroke="' + (fill ? "none" : "currentColor") + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + path + "</svg>";
  const I_PAUSE = IC('<rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>', true);
  const I_PLAY = IC('<path d="M8 5.5v13l11-6.5z"/>', true);
  const I_X = IC('<path d="M6 6l12 12M18 6L6 18"/>').replace('stroke-width="1.9"', 'stroke-width="2.4"');
  const I_DOC = IC('<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h5"/>');
  const I_FOLDER = IC('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>');
  const I_AGAIN = IC('<path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/>');
  const CHEV_C = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const CHEV_O = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  const S_FAIL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff453a" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v9M12 18v1"/></svg>';
  const hhmm = (t) => { const d = new Date(t * 1000); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };

  function tabInfo(j) {  // the status icon, the one-line status and the icon buttons of a meeting's tab
    const cur = j.steps.find((st) => st.state === "now" || st.state === "paused");
    const btn = (act, tip, icon, cls) => ({ act, tip, icon, cls: cls || "" });
    if (j.state === "queued") return { si: '<span class="ring"></span>', line: j.stopping ? "Cancelling…" : "Waiting for the meeting before it", cls: "", btns: j.stopping ? [] : [btn("cancel", "Cancel", I_X, "red")] };
    if (j.state === "paused") return { si: PAUSE_S, line: "Paused at " + (cur ? cur.label : "…"), cls: "amb", btns: [btn("resume", "Resume", I_PLAY, "amb"), btn("cancel", "Cancel", I_X, "red")] };
    if (j.state === "done") return { si: CHECK, line: "Done" + (j.finished ? " · " + hhmm(j.finished) : ""), cls: "grn", btns: [btn("summary", "Open summary", I_DOC), btn("folder", "Show folder", I_FOLDER), btn("dismiss", "Dismiss", I_X)] };
    if (j.state === "failed") return { si: S_FAIL, line: "Failed · " + (j.error || "see the folder"), cls: "red", btns: [btn("again", "Process again", I_AGAIN), btn("folder", "Show folder", I_FOLDER), btn("dismiss", "Dismiss", I_X)] };
    if (j.state === "cancelled") return { si: X_S, line: "Cancelled · the recording is kept", cls: "red", btns: [btn("again", "Process again", I_AGAIN), btn("dismiss", "Dismiss", I_X)] };
    let line = cur ? cur.label : "Working";  // running
    const kid = cur && (cur.children || []).find((c) => c.state === "now" && c.sub);
    if (kid) line += " · " + kid.sub; else if (cur && cur.sub) line += " · " + cur.sub;
    if (j.stopping) return { si: '<span class="spin"></span>', line: j.stopping === "cancel" ? "Stopping…" : "Pausing…", cls: "", btns: [] };
    return { si: '<span class="spin"></span>', line, cls: "", btns: [btn("pause", "Pause", I_PAUSE), btn("cancel", "Cancel", I_X, "red")] };
  }

  function openOf(jobs) {
    if (touched) return jobs.some((j) => j.id === openJob) ? openJob : null;
    if (jobs.length === 1) return jobs[0].id;
    const run = jobs.find((j) => j.state === "active");
    return run ? run.id : null;
  }

  function renderStatus(s) {
    const open = openOf(s.jobs);
    const tabs = s.jobs.slice().reverse().map((j) => {
      const t = tabInfo(j), isOpen = j.id === open;
      const buttons = t.btns.length ? '<div class="ib">' + t.btns.map((b) => '<i class="' + b.cls + '" data-act="' + b.act + '" data-job="' + j.id + '" data-tip="' + esc(b.tip) + '" role="button" aria-label="' + esc(b.tip) + '">' + b.icon + "</i>").join("") + "</div>" : "";
      const head = '<div class="th" tabindex="0" role="button" aria-expanded="' + isOpen + '" data-tab="' + j.id + '" data-tip="' + esc(j.name) + '" data-sub="' + esc(j.when || "") + '"><span class="chev">' + (isOpen ? CHEV_O : CHEV_C) + '</span><span class="si">' + t.si + '</span><div class="tt"><b>' + esc(j.name) + '</b><small class="' + t.cls + '">' + esc(t.line) + "</small></div>" + buttons + "</div>";
      let body = "";
      if (isOpen) {
        if (j.state === "failed") body = '<div class="err">' + esc(j.error || "Processing failed.") + "</div>";
        else body = renderSteps(j) + (j.state === "paused" && j.note ? '<div class="snote">' + esc(j.note) + "</div>" : "");
      }
      return '<div class="tb2" data-job="' + j.id + '">' + head + (body ? '<div class="tbody">' + body + "</div>" : "") + "</div>";
    }).join("");
    const foot = s.canRecord ? '<div class="btns"><button class="b" data-act="record">Start a new recording</button></div>' : "";
    const max = s.maxH ? "max-height:" + Math.max(160, Math.floor(s.maxH)) + "px" : "";
    return '<div class="card status" style="' + max + '"><div class="hd"><span>' + (s.jobs.length > 1 ? s.jobs.length + " meetings" : "Processing") + '</span><button class="x" data-act="close" aria-label="Close status">' + CLOSE + "</button></div>" +
      '<div class="rows">' + tabs + '</div><div class="tfoot">' + foot + '<div class="note">Meetings are processed one at a time. You can record while they run.</div></div></div>';
  }

  function toggleTab(id) {
    const wasOpen = openOf(spec.jobs) === id;  // (before your choice starts to count)
    touched = true;
    openJob = wasOpen ? null : id;
    const scroll = wrap.querySelector(".rows"), keep = scroll ? scroll.scrollTop : 0;
    hov = null;
    wrap.innerHTML = renderStatus(spec);
    const again = wrap.querySelector(".rows");
    if (again) { again.scrollTop = keep; const t = again.querySelector('.tb2[data-job="' + openJob + '"]'); if (t) t.scrollIntoView({ block: "nearest" }); }
    lastJson = "";
    report();
  }

  const TRASH = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';
  const WARN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>';
  const KIND = { pdf: "PDF", docx: "DOCX", pptx: "PPTX", xlsx: "XLSX", txt: "TXT", img: "IMG" };

  function renderDocs(s) {
    const rows = s.docs.map((d) => {
      const st = d.status, icon = st.k === "ok" ? CHECK_S : st.k === "run" ? '<span class="spin" style="width:11px;height:11px;border-width:2px"></span>' : st.k === "wait" ? "" : WARN;
      const bar = st.k === "run" ? '<div class="pb"><i style="width:' + Math.round((d.pct || 0) * 100) + '%"></i></div>' : "";
      return '<div class="dr" data-id="' + esc(d.id) + '"><div class="ft ' + esc(d.kind) + '">' + (KIND[d.kind] || "") + '</div><div class="dm"><div class="dn">' + esc(d.name) + '</div><div class="dd">' + esc(d.meta) + "</div>" + bar +
        '</div><div class="ds ' + (st.k === "run" || st.k === "wait" ? "" : st.k) + '">' + icon + "<span>" + esc(st.text) + '</span></div><button class="tr" data-act="docs_delete" data-id="' + esc(d.id) + '" aria-label="Delete ' + esc(d.name) + '">' + TRASH + "</button></div>";
    }).join("");
    const body = s.docs.length ? rows : '<div class="empty"><b>No documents yet</b>Add an agenda, slides or a report to give Claude more context for the summary.</div>';
    wrap.style.flexDirection = s.side === "right" ? "row-reverse" : "row";
    return '<div class="card docs" style="max-height:' + Math.max(160, Math.floor(s.maxH || 420)) + 'px"><div class="dh"><div><b>Documents</b><span class="n">' + s.docs.length + ' added</span></div><button class="x" data-act="docs_close" aria-label="Close documents">' + CLOSE + "</button></div>" +
      '<div class="rows">' + body + '</div><div class="dfoot"><button class="b" data-act="docs_add">Add documents…</button></div></div>';
  }

  // The list is refreshed every second while files are being read. Redrawing it would replace the very button the pointer is
  // pressing (a click needs the same element on mouse-down and mouse-up), so rows are updated in place unless the set of rows changed.
  function patchDocs(s) {
    const card = wrap.querySelector(".card.docs");
    if (!card) return false;
    const rows = [...card.querySelectorAll(".dr")];
    if (rows.length !== s.docs.length || rows.some((r, i) => r.dataset.id !== s.docs[i].id || (s.docs[i].status.k === "run" && !r.querySelector(".pb")))) return false;
    rows.forEach((r, i) => {
      const d = s.docs[i], st = d.status;
      r.querySelector(".dd").textContent = d.meta;
      const ds = r.querySelector(".ds");
      ds.className = "ds " + (st.k === "run" || st.k === "wait" ? "" : st.k);
      const icon = st.k === "ok" ? CHECK_S : st.k === "run" ? '<span class="spin" style="width:11px;height:11px;border-width:2px"></span>' : st.k === "wait" ? "" : WARN;
      const html = icon + "<span>" + esc(st.text) + "</span>";
      if (ds.dataset.h !== html) { ds.innerHTML = html; ds.dataset.h = html; }
      const pbox = r.querySelector(".pb"), pb = r.querySelector(".pb i");
      if (st.k !== "run" && pbox) pbox.remove();  // finished: the progress bar goes
      else if (pb) pb.style.width = Math.round((d.pct || 0) * 100) + "%";
    });
    card.querySelector(".dh .n").textContent = s.docs.length + " added";
    card.style.maxHeight = Math.max(160, Math.floor(s.maxH || 420)) + "px";
    return true;
  }

  function setSub(open) {
    if (open === subOpen) return;
    subOpen = open;
    const row = wrap.querySelector(".row[data-sub]"), sub = wrap.querySelector(".sub");
    if (row) row.classList.toggle("open", open);
    if (sub) sub.classList.toggle("on", open);
    postRects();
  }

  // The processing panel is redrawn every second while a step runs. A click needs the same button on mouse-down and
  // mouse-up, so while a button is held down the redraw waits until it is released.
  let pressing = false, deferred = null, pressTimer = null;
  function release() {
    pressing = false;
    clearTimeout(pressTimer);
    if (deferred) { const d = deferred; deferred = null; setTimeout(() => window.render(d), 0); }
  }
  document.addEventListener("mousedown", () => { pressing = true; clearTimeout(pressTimer); pressTimer = setTimeout(release, 1500); }, true);
  document.addEventListener("mouseup", () => setTimeout(release, 0), true);

  let lastJson = "";
  window.render = function (s) {
    if (pressing && s.kind === "status") { deferred = s; return; }
    if (s.kind === "docs" || s.kind === "status" || s.kind === "ctl") {
      const json = JSON.stringify({ ...s, fresh: false });
      if (!s.fresh && json === lastJson && spec && spec.kind === s.kind) { report(); return; }  // nothing changed: leave the buttons alone (a fresh one always draws, to slide in)
      lastJson = json;
      if (s.kind === "docs" && spec && spec.kind === "docs" && patchDocs(s)) { spec = { ...s, fresh: false }; report(); return; }
    } else {
      lastJson = "";
    }
    if (s.fresh || s.kind !== "menu") subOpen = false;
    spec = { ...s, fresh: false };
    hov = null;
    const scroll = wrap.querySelector(".rows"), keep = scroll ? scroll.scrollTop : 0;
    wrap.innerHTML = s.kind === "tip" ? renderTip(s) : s.kind === "toast" ? renderToast(s) : s.kind === "ctl" ? renderCtl(s) : s.kind === "menu" ? renderMenu(s) : s.kind === "docs" ? renderDocs(s) : renderStatus(s);
    const again = wrap.querySelector(".rows");
    if (again && keep) again.scrollTop = keep;  // the list is redrawn every second while files are being read: stay where you were
    report();
  };

  function report() {
    const r = wrap.getBoundingClientRect();
    let h = Math.ceil(r.height);
    // The processing panel's window is always as tall as it can ever be: opening or closing a tab only changes what is drawn
    // inside it, never the window (resizing a web view flickers). Python lets clicks through everywhere but the card.
    if (spec && spec.kind === "status" && spec.maxH) h = Math.max(h, Math.floor(spec.maxH) + 28);
    lastSize = Math.ceil(r.width) + "x" + h;
    post({ op: "size", w: Math.ceil(r.width), h });
    postRects();
  }

  // The bar has slid all the way out (Python says so, a moment after it started): the buttons respond from now on, and their
  // places are measured again (they were measured while the bar was still moving).
  window.__ready = function () {
    const c = wrap.querySelector(".ctlclip");
    if (c && !c.classList.contains("out")) { c.classList.add("ready"); postRects(); }
  };
  window.__slideOut = function () { const c = wrap.querySelector(".ctlclip"); if (c) c.classList.add("out"); };
  window.__fade = function () { const t = wrap.querySelector(".toast"); if (t) t.classList.add("fade"); };
  window.addEventListener("resize", () => postRects());
  wrap.addEventListener("scroll", () => postRects(), true);  // scrolling the documents list moves the rows  // the panel was resized to fit: positions changed

  // What Python needs to know about this page: for the menu, which parts are really menu (everywhere else a click
  // must reach the app behind); for any page, where the rows and buttons are, so it can tell which one the pointer
  // is over (the page does not reliably hear about the mouse while its panel is not the key window).
  function postRects() {
    if (!spec) return;
    const list = [];
    if (spec.kind === "menu" || spec.kind === "status") {
      wrap.querySelectorAll(".card").forEach((el) => {
        if (getComputedStyle(el).visibility === "hidden") return;
        const r = el.getBoundingClientRect();
        list.push({ x: r.x, y: r.y, w: r.width, h: r.height });
      });
    }
    const rows = [];
    wrap.querySelectorAll(".row, .b, .x, .tr, .cb, .th, .ib i").forEach((el, i) => {
      el.dataset.hi = i;
      const card = el.closest(".card");
      if (!card || getComputedStyle(card).visibility === "hidden") return;
      // (the sliding bar is measured where it will rest, not where the animation has it right now)
      let r = el.getBoundingClientRect();
      if (spec.kind === "ctl") {
        const m = new DOMMatrix(getComputedStyle(el.closest(".ctl")).transform);  // take the slide's offset back out
        r = { x: r.x - m.m41, y: r.y - m.m42, width: r.width, height: r.height, top: r.top - m.m42, bottom: r.bottom - m.m42 };
      }
      const box = el.closest(".rows");
      if (box) {  // a row scrolled out of the list can not be hovered or clicked
        const b = box.getBoundingClientRect();
        if (r.bottom < b.top + 2 || r.top > b.bottom - 2) return;
      }
      rows.push({ i, x: r.x, y: r.y, w: r.width, h: r.height, tip: el.dataset.tip || "", sub: el.dataset.sub || "", tab: el.classList.contains("th") });
    });
    rows.sort((a, b) => a.w * a.h - b.w * b.h);  // a tab's icon buttons sit inside its row: the smaller one wins when the pointer is on both
    post({ op: "rects", rects: list, rows });
  }

  // Python found the pointer over item i (-1: none). In the menu, "Summary style" opens its submenu, another menu
  // row closes it, a submenu row (or the gap between the two) leaves it as it is.
  window.__setHoverRow = function (i) {
    if (hov) hov.classList.remove("hov");
    hov = i >= 0 ? wrap.querySelector('[data-hi="' + i + '"]') : null;
    if (hov) {
      hov.classList.add("hov");
      if (spec && spec.kind === "menu" && !hov.closest(".sub")) setSub(!!hov.dataset.sub);
    }
  };

  wrap.addEventListener("click", (e) => {
    const row = e.target.closest(".row, .b, .x, .tr, .cb, .th, .ib i");
    if (!row || !spec) return;
    if (spec.kind === "status" && row.dataset.tab) { toggleTab(Number(row.dataset.tab)); return; }
    if (spec.kind === "ctl") {
      const clip = wrap.querySelector(".ctlclip");  // the buttons only respond once the bar has fully slid out (and not while it slides back)
      if (row.dataset.act && clip && clip.classList.contains("ready") && !clip.classList.contains("out")) post({ op: "ctl_" + row.dataset.act });
      return;
    }
    if (spec.kind === "docs") { if (row.dataset.act) post({ op: row.dataset.act, id: row.dataset.id || null }); return; }
    if (row.dataset.sub) { setSub(true); return; }
    if (spec.kind === "menu" && row.dataset.id) post({ op: "menu_click", id: row.dataset.id });
    else if (row.dataset.act) post({ op: "status_" + row.dataset.act, id: row.dataset.job ? Number(row.dataset.job) : null });
  });
  wrap.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && (e.target.classList.contains("row") || e.target.classList.contains("th"))) { e.preventDefault(); e.target.click(); }
  });

  document.addEventListener("click", (e) => { const b = e.target.closest("button, .row"); if (b) b.blur(); }, true);

  post({ op: "ready" });
</script>
</body>
</html>
