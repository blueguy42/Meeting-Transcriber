<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="root">
<div class="bar" id="bar">
  <div class="grip" id="grip" aria-hidden="true">
    <svg width="24" height="10" viewBox="0 0 24 10" fill="#6f7079"><circle cx="6" cy="2" r="1.4"/><circle cx="12" cy="2" r="1.4"/><circle cx="18" cy="2" r="1.4"/><circle cx="6" cy="8" r="1.4"/><circle cx="12" cy="8" r="1.4"/><circle cx="18" cy="8" r="1.4"/></svg>
  </div>
  <button class="rec" id="rec" data-tip="rec" aria-label="Start recording">
    <svg class="ring" viewBox="0 0 48 48" aria-hidden="true">
      <circle id="ring-track" cx="24" cy="24" r="22" fill="none" stroke="#f2f2f5" stroke-width="2"/>
      <circle id="ring-arc" cx="24" cy="24" r="22" fill="none" stroke="#64a8ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 138.2" transform="rotate(-90 24 24)"/>
    </svg>
    <span class="face">
      <span class="dot" id="dot"></span>
      <svg class="glyph" id="glyph" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ececf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
    </span>
    <span class="badge" id="badge" role="button" aria-label="Show processing status"></span>
  </button>
  <span class="timer" id="timer">Ready</span>
  <div class="div"></div>
  <button class="btn" id="mic" data-tip="mic" aria-label="Mute microphone">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M3.5 3.5l17 17" stroke="#ff453a" stroke-width="2.4"/></svg>
  </button>
  <button class="btn" id="sys" data-tip="sys" aria-label="Mute system audio">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/><path class="slash" d="M3.5 3.5l17 17" stroke="#ff453a" stroke-width="2.4"/></svg>
  </button>
  <div class="div"></div>
  <button class="btn off" id="shot" data-tip="shot" aria-label="Take screenshot">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
  </button>
  <button class="btn off" id="notes" data-tip="notes" aria-label="Take notes">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h5"/></svg>
    <span class="ndot" id="ndot"></span>
  </button>
  <button class="btn off" id="docadd" data-tip="docadd" aria-label="Add documents">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 11.3l-8.1 8.1a4.6 4.6 0 0 1-6.5-6.5l8.5-8.5a3.1 3.1 0 0 1 4.4 4.4l-8.5 8.5a1.6 1.6 0 0 1-2.2-2.2l7.7-7.7"/></svg>
  </button>
  <button class="btn off" id="doclist" data-tip="doclist" aria-label="Documents">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3h7l3 3v12H10z"/><path d="M17 3v4h3"/><path d="M6 7v14h11"/></svg>
    <span class="dbadge" id="docdot"></span>
  </button>
  <div class="div"></div>
  <button class="btn warn" id="perm" data-tip="perm" aria-label="Permissions needed" style="display:none">
    <svg id="perm-warn" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>
    <svg id="perm-restart" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg>
  </button>
  <button class="btn" id="more" data-tip="more" aria-label="More">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
  </button>
  <button class="btn hide" id="hide" data-tip="hide" aria-label="Hide bar">
    <svg id="hide-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <button class="btn hide quit" id="quit" data-tip="quit" aria-label="Quit">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>
  </button>
</div>
<button class="tab" id="tab" data-tip="tab" aria-label="Show recording bar">
  <svg id="tab-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ececf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  <span class="tdot" id="tab-dot"></span>
  <span id="tab-text">Ready</span>
  <svg id="tab-mic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ececf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path d="M3.5 3.5l17 17" stroke="#ff453a" stroke-width="2.4"/></svg>
  <svg id="tab-sys" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ececf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/><path d="M3.5 3.5l17 17" stroke="#ff453a" stroke-width="2.4"/></svg>
</button>
</div>
<script src="../shared/bridge.js"></script>
<script src="overlay.js"></script>
</body>
</html>
